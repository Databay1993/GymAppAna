  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    :root {
      --pink: #4a7c59;
      --pink2: #7daa8a;
      --yellow: #c8843a;
      --bg: #0e1210;
      --surface: #161c18;
      --surface2: #1e2820;
      --border: #2a3830;
      --text: #e8ede9;
      --muted: #7a8c7e;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }
    html, body { height: 100%; background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; overflow: hidden; }
    #app { height: 100%; display: flex; flex-direction: column; }

    /* sparkle bg */
    body::before {
      content: '';
      position: fixed; inset: 0; z-index: 0;
      background: radial-gradient(ellipse at 20% 20%, rgba(74,124,89,.1) 0%, transparent 60%),
                  radial-gradient(ellipse at 80% 80%, rgba(200,132,58,.06) 0%, transparent 60%);
      pointer-events: none;
    }

    .header {
      background: var(--surface);
      border-bottom: 2px solid var(--pink);
      padding: calc(var(--safe-top) + 10px) 16px 10px;
      display: flex; align-items: center; justify-content: space-between;
      flex-shrink: 0; position: relative; z-index: 10;
    }
    .logo {
      font-family: 'Pacifico', cursive;
      font-size: 22px;
      background: linear-gradient(90deg, #4a7c59, #c8843a);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      letter-spacing: 1px;
    }
    .nav-btn {
      background: none; border: 1px solid var(--border); color: var(--muted);
      padding: 6px 13px; border-radius: 20px; font-family: 'DM Sans', sans-serif;
      font-size: 13px; cursor: pointer;
    }
    .nav-btn-row { display: flex; gap: 8px; }

    .scroll { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; position: relative; z-index: 1; }
    .container { max-width: 540px; margin: 0 auto; padding: 18px 16px calc(var(--safe-bottom) + 90px); }

    /* HERO */
    .hero { text-align: center; padding: 22px 0 18px; }
    .hero-title { font-family: 'Bebas Neue', sans-serif; font-size: 44px; letter-spacing: 2px; line-height: 1.05; }
    .hero-title span { color: var(--pink); }
    .hero-meme {
      margin: 14px auto 0;
      width: 160px; height: 160px;
      border-radius: 50%;
      border: 3px solid #4a7c59;
      overflow: hidden;
      display: flex; align-items: center; justify-content: center;
      background: var(--surface2);
      font-size: 90px;
      box-shadow: 0 0 30px rgba(74,124,89,.4);
      animation: bobble 3s ease-in-out infinite;
    }
    @keyframes bobble { 0%,100%{transform:scale(1) rotate(-2deg)} 50%{transform:scale(1.05) rotate(2deg)} }
    .hero-sub { color: var(--muted); margin-top: 10px; font-size: 13px; line-height: 1.5; }
    .hero-sub strong { color: var(--pink2); }

    /* QUOTE TICKER */
    .quote-bar {
      background: #4a7c59;
      color: #fff;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 14px;
      letter-spacing: 2px;
      padding: 6px 0;
      overflow: hidden;
      margin-bottom: 18px;
      border-radius: 6px;
    }
    .quote-inner { white-space: nowrap; animation: ticker 18s linear infinite; display: inline-block; }
    @keyframes ticker { 0%{transform:translateX(100vw)} 100%{transform:translateX(-100%)} }

    /* STATS */
    .stats-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 18px; }
    .stat-card {
      background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
      padding: 12px 8px; text-align: center; position: relative; overflow: hidden;
    }
    .stat-card::before { content:''; position:absolute; inset:0; background: linear-gradient(135deg,rgba(74,124,89,.08),transparent); }
    .stat-num { font-family: 'Bebas Neue', sans-serif; font-size: 28px; color: var(--pink); }
    .stat-label { font-size: 9px; color: var(--muted); margin-top: 2px; text-transform: uppercase; letter-spacing: 1px; }
    .stat-emoji { font-size: 16px; }

    /* BUTTONS */
    .btn-primary {
      background: linear-gradient(90deg, #4a7c59, #5c9c6e);
      color: #000; border: none; padding: 15px 32px; border-radius: 8px;
      font-family: 'Bebas Neue', sans-serif; font-size: 22px; letter-spacing: 2px;
      cursor: pointer; width: 100%; display: block;
      box-shadow: 0 4px 20px rgba(74,124,89,.45);
      transition: transform .15s, box-shadow .15s;
    }
    .btn-primary:active { transform: scale(.97); box-shadow: 0 2px 10px rgba(74,124,89,.3); }
    .btn-secondary {
      background: var(--surface2); color: var(--text); border: 1px solid var(--border);
      padding: 11px 18px; border-radius: 8px; font-family: 'DM Sans', sans-serif;
      font-size: 14px; cursor: pointer;
    }
    .btn-ghost {
      background: none; border: 1px dashed var(--border); color: var(--muted);
      padding: 10px; border-radius: 8px; font-family: 'DM Sans', sans-serif;
      font-size: 13px; cursor: pointer; width: 100%;
    }
    .btn-icon { background: none; border: none; cursor: pointer; padding: 6px; color: var(--muted); font-size: 18px; }

    /* SECTION */
    .section-title { font-family: 'Bebas Neue', sans-serif; font-size: 17px; letter-spacing: 2px; color: var(--muted); margin-bottom: 10px; }
    .section-block { margin-top: 22px; }

    /* INPUT */
    .input-row { display: flex; gap: 8px; }
    .text-input {
      flex: 1; background: var(--surface2); border: 1px solid var(--border); color: var(--text);
      padding: 11px 14px; border-radius: 8px; font-family: 'DM Sans', sans-serif; font-size: 15px;
    }
    .text-input:focus { outline: none; border-color: var(--pink); }

    /* BACKUP */
    .backup-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .backup-btn {
      background: var(--surface2); border: 1px solid var(--border); color: var(--text);
      padding: 13px; border-radius: 8px; font-family: 'DM Sans', sans-serif; font-size: 14px;
      cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .backup-hint { font-size: 11px; color: var(--muted); text-align: center; margin-top: 8px; }

    /* EXERCISE CARD */
    .exercise-card {
      background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
      margin-bottom: 12px; overflow: hidden;
      transition: border-color .2s;
    }
    .exercise-card:hover { border-color: rgba(74,124,89,.4); }
    .exercise-header { padding: 13px 15px; display: flex; align-items: center; justify-content: space-between; }
    .exercise-name { font-weight: 600; font-size: 15px; }
    .last-session { background: rgba(74,124,89,.06); border-top: 1px solid rgba(74,124,89,.18); padding: 9px 15px; }
    .last-session-label { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; }
    .last-sets { display: flex; gap: 6px; flex-wrap: wrap; }
    .last-set-chip {
      background: rgba(74,124,89,.12); border: 1px solid rgba(74,124,89,.3);
      border-radius: 20px; padding: 3px 10px; font-size: 12px; color: var(--pink2);
    }
    .no-history { padding: 8px 15px; font-size: 12px; color: var(--muted); border-top: 1px solid var(--border); }

    .sets-body { padding: 10px 12px 12px; border-top: 1px solid var(--border); }
    .set-row { display: grid; grid-template-columns: 26px 1fr 1fr 38px 34px; gap: 6px; align-items: start; margin-bottom: 7px; }
    .set-num { font-family: 'Bebas Neue', sans-serif; font-size: 18px; color: var(--muted); text-align: center; padding-top: 8px; }
    .set-input {
      background: var(--surface2); border: 1px solid var(--border); color: var(--text);
      padding: 9px 6px; border-radius: 8px; font-family: 'DM Sans', sans-serif;
      font-size: 15px; text-align: center; width: 100%;
    }
    .set-input:focus { outline: none; border-color: var(--pink); }
    .set-input.done { border-color: rgba(74,124,89,.5); background: rgba(74,124,89,.1); color: var(--pink2); }
    .check-btn {
      background: var(--surface2); border: 1px solid var(--border); color: var(--muted);
      width: 38px; height: 38px; border-radius: 8px; cursor: pointer; font-size: 16px;
      display: flex; align-items: center; justify-content: center; transition: all .15s;
    }
    .check-btn.done { background: var(--pink); border-color: var(--pink); color: #000; font-weight: 700; }
    .del-btn {
      background: none; border: none; color: #555; cursor: pointer; font-size: 20px;
      width: 34px; height: 38px; display: flex; align-items: center; justify-content: center; border-radius: 8px;
    }

    /* WORKOUT FOOTER */
    .workout-footer {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: var(--surface); border-top: 1px solid var(--border);
      padding: 12px 16px calc(var(--safe-bottom) + 12px);
    }

    /* MODAL */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,.9); z-index: 200;
      display: flex; align-items: flex-end; justify-content: center;
    }
    .modal {
      background: var(--surface); border-top: 2px solid #4a7c59;
      border-radius: 20px 20px 0 0; width: 100%; max-width: 540px;
      max-height: 80vh; overflow-y: auto;
      padding: 20px 16px calc(var(--safe-bottom) + 20px);
    }
    .modal-title { font-family: 'Bebas Neue', sans-serif; font-size: 22px; letter-spacing: 2px; margin-bottom: 14px; color: var(--pink); }
    .ex-list { list-style: none; }
    .ex-list li {
      padding: 13px 4px; border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
      font-size: 15px; cursor: pointer;
    }
    .ex-tag { font-size: 10px; color: #7daa8a; background: rgba(74,124,89,.12); padding: 2px 8px; border-radius: 10px; }
    .ex-done { font-size: 12px; color: var(--pink); }

    /* TOAST */
    .toast {
      position: fixed; bottom: calc(var(--safe-bottom) + 80px); left: 50%;
      transform: translateX(-50%); background: var(--pink); color: #000;
      padding: 10px 22px; border-radius: 30px; font-weight: 600; font-size: 14px;
      z-index: 999; animation: slideUp .25s ease; white-space: nowrap;
    }
    @keyframes slideUp { from{opacity:0;transform:translateX(-50%) translateY(12px)} to{opacity:1;transform:translateX(-50%) translateY(0)} }

    /* HISTORY */
    .history-entry {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 8px; margin-bottom: 8px; padding: 13px 14px;
    }
    .history-date { font-size: 11px; color: var(--muted); margin-bottom: 7px; }
    .history-sets { display: flex; gap: 6px; flex-wrap: wrap; }
    .history-chip { background: var(--surface2); border: 1px solid var(--border); border-radius: 20px; padding: 3px 11px; font-size: 13px; }
    .history-ex-title { font-family: 'Bebas Neue', sans-serif; font-size: 19px; letter-spacing: 1px; color: var(--pink); margin-bottom: 8px; }
    .history-block { margin-bottom: 22px; }
    .history-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; }
    .empty-state { text-align: center; color: var(--muted); padding: 40px 0; font-size: 14px; line-height: 1.8; }

    /* TIMER */
    .timer-bubble {
      position: fixed; bottom: calc(var(--safe-bottom) + 76px); right: 16px;
      width: 72px; height: 72px; border-radius: 50%;
      background: var(--surface); border: 2px solid var(--pink);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      cursor: pointer; z-index: 51; box-shadow: 0 4px 20px rgba(74,124,89,.45);
    }
    .timer-svg { position: absolute; top: 0; left: 0; width: 72px; height: 72px; transform: rotate(-90deg); }
    .timer-track { fill: none; stroke: var(--border); stroke-width: 3; }
    .timer-progress { fill: none; stroke: var(--pink); stroke-width: 3; stroke-linecap: round; transition: stroke-dashoffset 0.5s linear; }
    .timer-progress.urgent { stroke: #ff4545; }
    .timer-num { font-family: 'Bebas Neue', sans-serif; font-size: 20px; color: var(--text); line-height: 1; z-index:1; }
    .timer-label { font-size: 8px; color: var(--muted); z-index:1; }

    /* REST */
    .rest-settings {
      display: flex; align-items: center; gap: 10px;
      background: var(--surface2); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px;
    }
    .rest-settings span { font-size: 13px; color: var(--muted); flex: 1; }
    .rest-val { font-family: 'Bebas Neue', sans-serif; font-size: 22px; color: var(--pink); min-width: 44px; text-align: center; }
    .rest-btn {
      background: var(--surface); border: 1px solid var(--border); color: var(--text);
      width: 32px; height: 32px; border-radius: 8px; font-size: 18px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }

    /* PR CARDS */
    .pr-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; margin-bottom: 10px; }
    .pr-name { font-weight: 600; font-size: 15px; margin-bottom: 8px; }
    .pr-row { display: flex; gap: 8px; flex-wrap: wrap; }
    .pr-chip { background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; padding: 6px 12px; font-size: 12px; text-align: center; }
    .pr-chip-val { font-family: 'Bebas Neue', sans-serif; font-size: 20px; color: var(--pink); display: block; }
    .pr-chip-label { color: var(--muted); font-size: 10px; text-transform: uppercase; letter-spacing: 1px; }
    .vol-bar-wrap { margin-bottom: 14px; }
    .vol-bar-label { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 4px; }
    .vol-bar-label span:last-child { color: var(--pink); font-family: 'Bebas Neue', sans-serif; font-size: 15px; }
    .vol-bar-bg { background: var(--surface2); border-radius: 4px; height: 8px; overflow: hidden; }
    .vol-bar-fill { height: 100%; background: linear-gradient(90deg,#4a7c59,#c8843a); border-radius: 4px; }
    .freq-row { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
    .freq-chip { background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; padding: 5px 10px; font-size: 12px; color: var(--muted); }
    .freq-chip.active { border-color: var(--pink); color: var(--pink); background: rgba(74,124,89,.08); }
    .workout-banner { background: linear-gradient(90deg,#4a7c59,#5c9c6e); color: #000; padding: 10px 16px; display: flex; align-items: center; justify-content: space-between; font-weight: 700; font-size: 14px; flex-shrink: 0; }

    /* CELEBRATION */
    .celebration-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,.95); z-index: 500;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      animation: fadeInCel .4s ease; padding: 20px;
    }
    @keyframes fadeInCel { from{opacity:0;transform:scale(.85)} to{opacity:1;transform:scale(1)} }
    .celebration-meme {
      font-size: 110px;
      animation: memeWiggle .5s ease infinite alternate;
      filter: drop-shadow(0 0 30px rgba(255,63,164,.8));
    }
    @keyframes memeWiggle { from{transform:scale(1) rotate(-4deg)} to{transform:scale(1.12) rotate(4deg)} }
    .celebration-text {
      font-family: 'Bebas Neue', sans-serif; font-size: 38px; letter-spacing: 3px;
      color: var(--pink); margin-top: 16px; text-align: center; line-height: 1.1;
    }
    .celebration-sub { color: var(--text); font-size: 15px; margin-top: 8px; text-align: center; line-height: 1.6; max-width: 300px; }
    .celebration-btn {
      margin-top: 28px; background: linear-gradient(90deg,#4a7c59,#5c9c6e);
      color: #000; border: none; padding: 14px 36px; border-radius: 8px;
      font-family: 'Bebas Neue', sans-serif; font-size: 22px; letter-spacing: 2px; cursor: pointer;
      box-shadow: 0 4px 20px rgba(74,124,89,.5);
    }

    /* MEME GALLERY */
    .meme-gallery { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 8px; }
    .meme-card {
      background: var(--surface2); border: 1px solid var(--border); border-radius: 12px;
      padding: 14px 10px; text-align: center; cursor: pointer;
      transition: border-color .2s, transform .15s;
    }
    .meme-card:active { transform: scale(.96); }
    .meme-card:hover { border-color: var(--pink); }
    .meme-emoji { font-size: 48px; display: block; margin-bottom: 6px; }
    .meme-caption { font-size: 11px; color: var(--muted); }

    /* PINK BORDER ACCENT */
    .pink-accent { border-left: 3px solid var(--pink); padding-left: 10px; }

    .reps-hint { display:inline-block; font-size:11px; color:var(--pink2); background:rgba(74,124,89,.12); border:1px solid rgba(255,63,164,.25); border-radius:10px; padding:1px 7px; text-align:center; }
  </style>
</head>

function getTodayKey() {
  const now = new Date();
  return `${now.getMonth() + 1}-${now.getDate()}`;
}

function getArgentinaDay() {
  return ARGENTINA_DAYS[getTodayKey()] || null;
}

function isArgentinaDay() {
  return !!getArgentinaDay();
}

// CSS vars for Argentina theme override
function getArgentinaThemeStyle(day) {
  if (!day) return '';
  if (day.type === 'independence' || day.type === 'messi_birthday' || day.type === 'wc1978' || day.type === 'wc1986' || day.type === 'wc2022' || day.type === 'maradona_birthday') {
    return `
      :root {
        --pink: ${day.accentColor === '#ffffff' ? '#75aadb' : day.accentColor};
        --pink2: #75aadb;
        --yellow: #ffe135;
        --bg: #0a1520;
        --surface: #0f1e2e;
        --surface2: #162535;
        --border: #1e3a5a;
        --text: #f0f8ff;
      }
      body::before {
        background: radial-gradient(ellipse at 30% 10%, rgba(116,170,219,.18) 0%, transparent 55%),
                    radial-gradient(ellipse at 70% 90%, rgba(255,255,255,.08) 0%, transparent 55%);
      }
      .header { border-bottom-color: #75aadb !important; }
      .logo { background: linear-gradient(90deg, #75aadb, #ffffff, #75aadb) !important; -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
      .btn-primary { background: linear-gradient(90deg, #75aadb, #fff) !important; color: #0a1520 !important; box-shadow: 0 4px 20px rgba(116,170,219,.5) !important; }
      .stat-num, .pr-chip-val, .vol-bar-label span:last-child, .last-set-chip, .ex-done, .rest-val { color: #75aadb !important; }
      .last-session { background: rgba(116,170,219,.08) !important; border-top-color: rgba(116,170,219,.2) !important; }
      .last-set-chip { background: rgba(116,170,219,.12) !important; border-color: rgba(116,170,219,.3) !important; color: #9fc8e8 !important; }

      .modal-title { color: #75aadb !important; }
      .text-input:focus { border-color: #75aadb !important; }
      .quote-bar { background: #75aadb !important; }
      .stat-card::before { background: linear-gradient(135deg,rgba(116,170,219,.1),transparent) !important; }
      .hero-meme { border-color: #75aadb !important; box-shadow: 0 0 40px rgba(116,170,219,.5) !important; }

      .vol-bar-fill { background: linear-gradient(90deg,#75aadb,#ffffff) !important; }

      .history-ex-title { color: #75aadb !important; }
      .exercise-card:hover { border-color: rgba(116,170,219,.4) !important; }
      .ex-tag { color: #75aadb !important; background: rgba(116,170,219,.12) !important; }
      .toast { background: #75aadb !important; }
      .meme-card:hover { border-color: #75aadb !important; }
      .reps-hint { color: #9fc8e8 !important; background: rgba(116,170,219,.12) !important; border-color: rgba(116,170,219,.3) !important; }
    `;
  }
  if (day.type === 'maradona_death') {
    return `
      :root { --pink: #75aadb; --pink2: #5588bb; --bg: #070d18; --surface: #0d1828; --surface2: #111f35; --border: #1a2d45; --text: #c8dff0; }

      .btn-primary { background: linear-gradient(90deg,#2a4a75,#4a6a95) !important; color: #fff !important; }

      .hero-title span { color: #75aadb !important; }
      .toast { background: #75aadb !important; }
    `;
  }
  return '';
}

function loadLocal() {
  try { const r = localStorage.getItem(STORAGE_KEY); return r ? JSON.parse(r) : { history: {}, customExercises: [] }; }
  catch { return { history: {}, customExercises: [] }; }
}
function saveLocal() { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state.data)); } catch {} }

let tokenClient;
window.onGoogleLibraryLoad = () => {
  tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: CLIENT_ID, scope: SCOPES,
    callback: async (resp) => {
      if (resp.error) { showToast('Google Login fehlgeschlagen ✗'); return; }
      state.accessToken = resp.access_token;
      state.syncStatus = 'connected';
      showToast('¡Conectado! ✓ Cargando datos...'); render();
      await syncFromDrive();
    }
  });
};
function googleSignIn() { if(!tokenClient){showToast('Google aún no cargado...');return;} tokenClient.requestAccessToken(); }
function googleSignOut() {
  if(state.accessToken) google.accounts.oauth2.revoke(state.accessToken);
  state.accessToken=null; state.driveFileId=null; state.syncStatus='disconnected';
  showToast('Abgemeldet 👋'); render();
}
async function syncFromDrive() {
  if(!state.accessToken) return;
  state.syncStatus='syncing'; render();
  try {
    const search = await fetch(`https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&q=name='${DRIVE_FILE}'&fields=files(id,name)`,{headers:{Authorization:`Bearer ${state.accessToken}`}});
    const searchData = await search.json();
    if(searchData.files && searchData.files.length>0) {
      state.driveFileId = searchData.files[0].id;
      const dl = await fetch(`https://www.googleapis.com/drive/v3/files/${state.driveFileId}?alt=media`,{headers:{Authorization:`Bearer ${state.accessToken}`}});
      const driveData = await dl.json();
      state.data = mergeData(state.data, driveData);
      saveLocal(); showToast('¡Datos sincronizados! ✓ 🎉');
    } else { await syncToDrive(); }
  } catch(e) { showToast('Error de sincronización ✗'); }
  state.syncStatus='connected'; render();
}
async function syncToDrive() {
  if(!state.accessToken) return;
  state.syncStatus='syncing'; render();
  try {
    const body = JSON.stringify(state.data);
    if(state.driveFileId) {
      await fetch(`https://www.googleapis.com/upload/drive/v3/files/${state.driveFileId}?uploadType=media`,{method:'PATCH',headers:{Authorization:`Bearer ${state.accessToken}`,'Content-Type':'application/json'},body});
    } else {
      const meta = await fetch('https://www.googleapis.com/drive/v3/files',{method:'POST',headers:{Authorization:`Bearer ${state.accessToken}`,'Content-Type':'application/json'},body:JSON.stringify({name:DRIVE_FILE,parents:['appDataFolder']})});
      const metaData = await meta.json();
      state.driveFileId = metaData.id;
      await fetch(`https://www.googleapis.com/upload/drive/v3/files/${state.driveFileId}?uploadType=media`,{method:'PATCH',headers:{Authorization:`Bearer ${state.accessToken}`,'Content-Type':'application/json'},body});
    }
  } catch(e) { showToast('Drive Error ✗'); }
  state.syncStatus='connected'; render();
}
function mergeData(local, drive) {
  const merged={history:{},customExercises:[]};
  const allKeys=new Set([...Object.keys(local.history||{}),...Object.keys(drive.history||{})]);
  allKeys.forEach(key=>{
    const combined=[...(local.history[key]||[]),...(drive.history[key]||[])];
    const seen=new Set();
    merged.history[key]=combined.filter(e=>{const k=e.date;if(seen.has(k))return false;seen.add(k);return true;}).sort((a,b)=>a.date.localeCompare(b.date));
  });
  merged.customExercises=[...new Set([...(local.customExercises||[]),...(drive.customExercises||[])])];
  return merged;
}
function syncStatusHTML() {
  const labels={disconnected:'Sin conexión',connected:'Drive sincronizado',syncing:'Sincronizando...'};
  const dotClass=state.syncStatus==='connected'?'connected':state.syncStatus==='syncing'?'syncing':'';
  const dotCSS='width:8px;height:8px;border-radius:50%;flex-shrink:0;background:';
  const dotColor=state.syncStatus==='connected'?'#4caf50':state.syncStatus==='syncing'?'var(--pink)':'var(--muted)';
  if(state.accessToken)return`<div style="display:flex;align-items:center;justify-content:space-between;background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:12px 14px;margin-bottom:10px"><div style="font-size:13px;display:flex;align-items:center;gap:8px"><div style="${dotCSS}${dotColor}${state.syncStatus==='syncing'?';animation:pulse 1s infinite':''}"></div><span>${labels[state.syncStatus]}</span></div><div style="display:flex;gap:8px"><button class="btn-secondary" style="padding:6px 12px;font-size:12px" onclick="syncFromDrive()">↻ Sync</button><button class="btn-secondary" style="padding:6px 12px;font-size:12px;color:#ff6b6b" onclick="googleSignOut()">Salir</button></div></div>`;
  return`<button style="background:var(--surface2);border:1px solid rgba(74,124,89,.4);color:var(--text);padding:13px;border-radius:10px;font-family:'DM Sans',sans-serif;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;width:100%;margin-bottom:10px" onclick="googleSignIn()"><span style="font-size:18px">☁️</span><div style="text-align:left"><div style="font-size:14px;color:var(--pink2)">Conectar con Google Drive</div><div style="font-size:11px;color:var(--muted)">Respaldo automático en todos los dispositivos</div></div></button>`;
}
function setState(patch) { Object.assign(state, patch); render(); }
function showToast(msg) { clearTimeout(state.toastTimer); state.toast = msg; state.toastTimer = setTimeout(() => { state.toast = null; render(); }, 2600); render(); }
function allExercises() { return [...DEFAULT_EXERCISES, ...(state.data.customExercises || [])]; }
function getLastSession(name) { const h = state.data.history[name]; return h && h.length ? h[h.length - 1] : null; }
function totalWorkouts() { const d = new Set(); Object.values(state.data.history).forEach(a => a.forEach(e => d.add(e.date?.slice(0, 10)))); return d.size; }
function randomQuote() { return LUSTIGE_SPRÜCHE[Math.floor(Math.random() * LUSTIGE_SPRÜCHE.length)]; }

// Timer
function startRestTimer() {
  clearInterval(state.timerInterval);
  state.timerEndAt = Date.now() + state.restDuration * 1000;
  state.timerMax = state.restDuration; state.timerSeconds = state.restDuration; render();
  state.timerInterval = setInterval(() => {
    const rem = Math.max(0, Math.round((state.timerEndAt - Date.now()) / 1000));
    state.timerSeconds = rem; updateTimerDisplay();
    if (rem <= 0) { clearInterval(state.timerInterval); state.timerInterval = null; playBeep(); setTimeout(() => { state.timerSeconds = null; render(); }, 1500); }
  }, 500);
}
function cancelTimer() { clearInterval(state.timerInterval); state.timerInterval = null; state.timerSeconds = null; render(); }
function updateTimerDisplay() {
  const bubble = document.getElementById('timerBubble'); if (!bubble) { render(); return; }
  const num = bubble.querySelector('.timer-num'), prog = bubble.querySelector('.timer-progress');
  if (num) num.textContent = state.timerSeconds;
  if (prog) {
    const r = 33, circ = 2 * Math.PI * r;
    prog.style.strokeDasharray = circ; prog.style.strokeDashoffset = circ * (1 - state.timerSeconds / state.timerMax);
    state.timerSeconds <= 10 ? prog.classList.add('urgent') : prog.classList.remove('urgent');
  }
}
function playBeep() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    [0, 0.15, 0.3].forEach(delay => {
      const osc = ctx.createOscillator(), gain = ctx.createGain();
      osc.connect(gain); gain.connect(ctx.destination);
      osc.frequency.value = delay === 0.3 ? 880 : 660; osc.type = 'sine';
      gain.gain.setValueAtTime(0.4, ctx.currentTime + delay);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + delay + 0.25);
      osc.start(ctx.currentTime + delay); osc.stop(ctx.currentTime + delay + 0.25);
    });
  } catch (e) {}
}
function timerHTML() {
  if (state.timerSeconds === null) return '';
  const r = 33, circ = 2 * Math.PI * r, offset = circ * (1 - state.timerSeconds / state.timerMax);
  return `<div class="timer-bubble" id="timerBubble" onclick="cancelTimer()">
    <svg class="timer-svg" viewBox="0 0 72 72"><circle class="timer-track" cx="36" cy="36" r="${r}"/>
    <circle class="timer-progress${state.timerSeconds <= 10 ? ' urgent' : ''}" cx="36" cy="36" r="${r}" style="stroke-dasharray:${circ};stroke-dashoffset:${offset}"/></svg>
    <div class="timer-num">${state.timerSeconds}</div><div class="timer-label">Tippen ✕</div></div>`;
}

// Workout logic
function startWorkout() { setState({ workout: { date: new Date().toISOString(), exercises: [] }, view: 'workout' }); }
function addExerciseToWorkout(name) {
  if (state.workout.exercises.find(e => e.name === name)) { showToast('¡Ya está! 😄'); return; }
  const last = getLastSession(name);
  const sets = last ? last.sets.map(s => ({ reps: s.reps, weight: s.weight, done: false })) : [];
  state.workout.exercises.push({ name, sets });
  setState({ showAddEx: false, addExFilter: '' });
  setTimeout(() => { const s = document.querySelector('.scroll'); if (s) s.scrollTop = s.scrollHeight; }, 80);
}
function addSet(exName) {
  const ex = state.workout.exercises.find(e => e.name === exName); if (!ex) return;
  const prev = ex.sets[ex.sets.length - 1];
  ex.sets.push({ reps: prev?.reps || '', weight: prev?.weight || '', done: false });
  const sp = document.querySelector('.scroll')?.scrollTop || 0; render();
  requestAnimationFrame(() => { const s = document.querySelector('.scroll'); if (s) s.scrollTop = sp; });
}
function updateSet(exName, idx, field, value) { const ex = state.workout.exercises.find(e => e.name === exName); if (ex && ex.sets[idx]) ex.sets[idx][field] = value; }
function toggleDone(exName, idx) {
  const ex = state.workout.exercises.find(e => e.name === exName);
  if (ex && ex.sets[idx]) {
    const sp = document.querySelector('.scroll')?.scrollTop || 0;
    ex.sets[idx].done = !ex.sets[idx].done;
    if (ex.sets[idx].done) startRestTimer(); else if (state.timerSeconds !== null) cancelTimer();
    render();
    requestAnimationFrame(() => { const s = document.querySelector('.scroll'); if (s) s.scrollTop = sp; });
  }
}
function removeSet(exName, idx) {
  const ex = state.workout.exercises.find(e => e.name === exName); if (!ex) return;
  const sp = document.querySelector('.scroll')?.scrollTop || 0;
  ex.sets.splice(idx, 1); render();
  requestAnimationFrame(() => { const s = document.querySelector('.scroll'); if (s) s.scrollTop = sp; });
}
function removeExercise(name) { state.workout.exercises = state.workout.exercises.filter(e => e.name !== name); render(); }
function finishWorkout() {
  document.querySelectorAll('.set-input').forEach(inp => { const e = state.workout.exercises.find(e => e.name === inp.dataset.ex); if (e && e.sets[+inp.dataset.idx]) e.sets[+inp.dataset.idx][inp.dataset.field] = inp.value; });
  if (!state.workout.exercises.length) { showToast('Noch keine Ejercicios! 😅'); return; }
  const h = { ...state.data.history };
  state.workout.exercises.forEach(ex => {
    const done = ex.sets.filter(s => s.done || (s.reps && s.weight)); if (!done.length) return;
    if (!h[ex.name]) h[ex.name] = [];
    h[ex.name].push({ date: state.workout.date, sets: done.map(s => ({ reps: s.reps, weight: s.weight })) });
  });
  state.data.history = h; saveLocal();
  if (state.accessToken) syncToDrive();
  const argDay = getArgentinaDay();
  if (argDay) {
    setState({ workout: null, view: 'home', argentinaCelebration: argDay.celebration, celebration: null });
  } else {
    const celebIdx = Math.floor(Math.random() * MEME_CELEBRATIONS.length);
    setState({ workout: null, view: 'home', celebration: MEME_CELEBRATIONS[celebIdx] });
  }
}
function addCustomExercise(name) {
  name = name.trim(); if (!name) return;
  if (name === '1234') {
    state.devMode = !state.devMode;
    showToast(state.devMode ? '🔓 Modo dev activado' : '🔒 Modo dev desactivado');
    render(); return;
  }
  if (allExercises().includes(name)) { showToast('¡Ya existe! 😄'); return; }
  state.data.customExercises = [...(state.data.customExercises || []), name]; saveLocal(); showToast('Ejercicio agregado ✓'); render();
}
function deleteHistoryEntry(exName, idx) { state.data.history[exName].splice(idx, 1); saveLocal(); render(); }
function exportData() {
  const blob = new Blob([JSON.stringify(state.data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob); const a = document.createElement('a');
  a.href = url; a.download = `babe-gym-backup-${new Date().toISOString().slice(0, 10)}.json`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url); showToast('Backup guardado ✓ 💪');
}
function importData(file) {
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => { try { const p = JSON.parse(e.target.result); if (!p.history) throw 0; if (confirm('¿Sobrescribir datos?')) { state.data = p; saveLocal(); showToast('Importado ✓'); render(); } } catch { showToast('Archivo inválido ✗'); } };
  reader.readAsText(file);
}
function createAndAddExercise() {
  const inp = document.getElementById('newExWorkoutInput'); const name = inp?.value.trim(); if (!name) return;
  if (allExercises().includes(name)) { showToast('Gibt es schon!'); return; }
  state.data.customExercises = [...(state.data.customExercises || []), name]; saveLocal(); addExerciseToWorkout(name);
}

    '💀': '¡Eso es cara de día de piernas! 💀\nDolió, pero lo hiciste. ¡Sos crack!',
    '🌊': '¡Como una ola – volvés más fuerte! 🌊\nSurf & gains. La combo perfecta.',
    '😴': 'Mañana... mañana... 😴\n¡MENTIRA! Abrís la app y entrenás. 💪',
    '🌿': '¡El gym huele a bosque hoy! 🌿\nNaturaleza + fuerza = Ani mode.',
    '🦁': '¡ÚLTIMO SET! 🦁\n"La venganza es un plato que se sirve frío." 🧊',
  };
  const msg = surprises[emoji] || `${emoji} ${caption} – ¡Así se hace!`;
  const overlay = document.createElement('div');
  overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:700;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px;text-align:center';
  overlay.innerHTML = `<div style="font-size:80px;margin-bottom:20px">${emoji}</div>
    <div style="font-family:Bebas Neue,sans-serif;font-size:22px;color:#4a7c59;letter-spacing:2px;margin-bottom:12px">${caption.toUpperCase()}</div>
    <div style="color:#e8ede9;font-size:15px;line-height:1.7;white-space:pre-line;max-width:300px">${msg}</div>
    <button onclick="this.parentElement.remove()" style="margin-top:28px;background:#4a7c59;color:#fff;border:none;padding:12px 30px;border-radius:8px;font-family:Bebas Neue,sans-serif;font-size:20px;letter-spacing:2px;cursor:pointer">¡BUENÍSIMO!</button>`;
  document.getElementById('app').appendChild(overlay);
}

function render() {
  injectArgentinaTheme();
  const app = document.getElementById('app');
  const fid = document.activeElement?.id, ss = document.activeElement?.selectionStart, se = document.activeElement?.selectionEnd;
  if (state.view === 'home') app.innerHTML = renderHome();
  else if (state.view === 'history') app.innerHTML = renderHistory();
  else if (state.view === 'workout') app.innerHTML = renderWorkout();
  else if (state.view === 'stats') app.innerHTML = renderStats();
  else if (state.view === 'memes') app.innerHTML = renderMemes();
  if (state.toast) { const t = document.createElement('div'); t.className = 'toast'; t.textContent = state.toast; app.appendChild(t); }
  if (fid) { const el = document.getElementById(fid); if (el) { el.focus(); try { el.setSelectionRange(ss, se); } catch {} } }
  // Argentina day splash on open
  if (state.argentinaSplash) {
    const splash = document.createElement('div');
    splash.innerHTML = argentinaCelebrationHTML(state.argentinaSplash.celebration, false);
    app.appendChild(splash.firstElementChild);
    return;
  }
  // Argentina celebration after workout finish
  if (state.argentinaCelebration) {
    const cel = document.createElement('div');
    cel.innerHTML = argentinaCelebrationHTML(state.argentinaCelebration, true);
    app.appendChild(cel.firstElementChild);
    return;
  }
  // Normal workout celebration
  if (state.celebration) {
    const cel = document.createElement('div'); cel.className = 'celebration-overlay';
    cel.innerHTML = `<div class="celebration-meme">${state.celebration.emoji}</div>
      <div class="celebration-text">${state.celebration.text}</div>
      <div class="celebration-sub">${state.celebration.sub}</div>
      <button class="celebration-btn" onclick="state.celebration=null;render()">CONTINUAR 💪</button>`;
    app.appendChild(cel);
  }
}

function renderStats() {
  const history = state.data.history, exNames = Object.keys(history).filter(k => history[k].length);
  function getPR(n) { let mw = 0, mr = 0, mv = 0; history[n].forEach(s => s.sets.forEach(s => { const w = parseFloat(s.weight) || 0, r = parseFloat(s.reps) || 0; if (w > mw) mw = w; if (r > mr) mr = r; if (w * r > mv) mv = w * r; })); return { mw, mr, mv: Math.round(mv) }; }
  function getVol(n) { return history[n].reduce((s, sess) => s + sess.sets.reduce((s2, s) => s2 + (parseFloat(s.weight) || 0) * (parseFloat(s.reps) || 0), 0), 0); }
  const prCards = exNames.map(n => { const pr = getPR(n); return `<div class="pr-card"><div class="pr-name">${n} <span style="color:var(--muted);font-size:12px;font-weight:400">${history[n].length} sesiones</span></div><div class="pr-row"><div class="pr-chip"><span class="pr-chip-val">${pr.mw}kg</span><span class="pr-chip-label">Máx. peso</span></div><div class="pr-chip"><span class="pr-chip-val">${pr.mr}</span><span class="pr-chip-label">Max Reps</span></div><div class="pr-chip"><span class="pr-chip-val">${pr.mv}</span><span class="pr-chip-label">Mejor vol.</span></div></div></div>`; }).join('');
  const maxVol = Math.max(...exNames.map(getVol), 1);
  const volBars = exNames.sort((a, b) => getVol(b) - getVol(a)).map(n => { const v = Math.round(getVol(n)); return `<div class="vol-bar-wrap"><div class="vol-bar-label"><span>${n}</span><span>${v.toLocaleString()} kg</span></div><div class="vol-bar-bg"><div class="vol-bar-fill" style="width:${Math.round(v / maxVol * 100)}%"></div></div></div>`; }).join('');
  const ts = Object.values(history).reduce((s, a) => s + a.reduce((ss, e) => ss + e.sets.length, 0), 0);
  const tv = Math.round(Object.keys(history).reduce((s, k) => s + getVol(k), 0));
  return `<div class="header"><span class="logo">Estadísticas 📊</span><button class="nav-btn" onclick="setState({view:'home'})">← Volver</button></div>
  ${workoutBannerHTML()}<div class="scroll" style="position:relative">
    <div style="position:fixed;inset:0;background:url('${STATS_BG}') center top/cover no-repeat;opacity:.13;pointer-events:none;z-index:0"></div>
    <div class="container" style="position:relative;z-index:1">
    <div class="stats-row" style="margin-top:4px;margin-bottom:24px">
      <div class="stat-card"><div class="stat-num">${totalWorkouts()}</div><div class="stat-label">Entrenos</div></div>
      <div class="stat-card"><div class="stat-num">${ts}</div><div class="stat-label">Series</div></div>
      <div class="stat-card"><div class="stat-num">${(tv / 1000).toFixed(1)}t</div><div class="stat-label">Volumen</div></div>
    </div>
    <div class="section-title">🏆 Récords personales</div>
    ${exNames.length === 0 ? '<div class="empty-state">¡Todavía sin datos! 💪<br/>¡Empezá a entrenar!</div>' : prCards}
    <div class="section-title" style="margin-top:24px">📈 Volumen total</div>
    ${exNames.length === 0 ? '' : volBars}
  </div></div>`;
}

function renderHistory() {
  const exList = Object.keys(state.data.history).filter(k => state.data.history[k].length);
  const inner = exList.length === 0
    ? `<div class="empty-state">¡Todavía sin entrenos!<br/>¡Empezá ya! 💪</div>`
    : exList.map(exName => {
      const entries = [...state.data.history[exName]].reverse();
      const rows = entries.map((entry, ri) => {
        const realIdx = state.data.history[exName].length - 1 - ri;
        const d = new Date(entry.date).toLocaleDateString('de-DE', { weekday: 'short', day: '2-digit', month: 'short', year: 'numeric' });
        const chips = entry.sets.map(s => `<span class="history-chip">${s.reps} × ${s.weight} kg</span>`).join('');
        return `<div class="history-entry"><div class="history-header"><div class="history-date">${d}</div><button class="btn-icon" onclick="deleteHistoryEntry('${exName.replace(/'/g, "\\'")}',${realIdx})">🗑</button></div><div class="history-sets">${chips}</div></div>`;
      }).join('');
      return `<div class="history-block"><div class="history-ex-title">${exName}</div>${rows}</div>`;
    }).join('');
  return `<div class="header"><span class="logo">Historial 📅</span><button class="nav-btn" onclick="setState({view:'home'})">← Volver</button></div>
  ${workoutBannerHTML()}<div class="scroll"><div class="container"><div class="section-title" style="margin-top:4px">Entrenos-Historial</div>${inner}</div></div>`;
}

function renderWorkout() {
  const dateStr = new Date(state.workout.date).toLocaleDateString('de-DE', { weekday: 'long', day: '2-digit', month: 'long' });
  const cards = state.workout.exercises.map(ex => {
    const last = getLastSession(ex.name);
    const lastHTML = last
      ? `<div class="last-session"><div class="last-session-label">⏱ Última vez · ${new Date(last.date).toLocaleDateString('de-DE', { day: '2-digit', month: 'short' })}</div><div class="last-sets">${last.sets.map((s, i) => `<span class="last-set-chip">S${i + 1}: ${s.reps}×${s.weight}kg</span>`).join('')}</div></div>`
      : `<div class="no-history">¡Primera vez – a tope! 🔥</div>`;
    const setsHTML = ex.sets.map((s, idx) => {
      const uid = (ex.name + '-' + idx).replace(/[^a-zA-Z0-9]/g, '_');
      return `<div class="set-row"><div class="set-num">${idx + 1}</div>
        <input id="reps_${uid}" class="set-input${s.done ? ' done' : ''}" type="text" inputmode="numeric" placeholder="Reps" value="${s.reps}" data-ex="${ex.name.replace(/"/g, '&quot;')}" data-idx="${idx}" data-field="reps" oninput="updateSet(this.dataset.ex,+this.dataset.idx,'reps',this.value)"/>
        <input id="wt_${uid}" class="set-input${s.done ? ' done' : ''}" type="text" inputmode="decimal" placeholder="kg" value="${s.weight}" data-ex="${ex.name.replace(/"/g, '&quot;')}" data-idx="${idx}" data-field="weight" oninput="updateSet(this.dataset.ex,+this.dataset.idx,'weight',this.value)"/>
        <button class="check-btn${s.done ? ' done' : ''}" onclick="toggleDone('${ex.name.replace(/'/g, "\\'")}',${idx})">${s.done ? '✓' : '○'}</button>
        <button class="del-btn" onclick="removeSet('${ex.name.replace(/'/g, "\\'")}',${idx})">×</button>
      </div>`;
    }).join('');
    return `<div class="exercise-card">
      <div class="exercise-header"><span class="exercise-name">${ex.name}</span>
      <button class="btn-icon" style="color:#555;font-size:15px" onclick="removeExercise('${ex.name.replace(/'/g, "\\'")}')">✕</button></div>
      ${lastHTML}
      <div class="sets-body">${setsHTML}
      <button class="btn-ghost" onclick="addSet('${ex.name.replace(/'/g, "\\'")}')">+ Agregar serie</button>
      </div></div>`;
  }).join('');
  const empty = state.workout.exercises.length === 0 ? `<div class="empty-state">Keine Ejercicios.<br/>¡Agregá uno! 👇</div>` : '';
  const modalHTML = state.showAddEx ? (() => {
    const fl = state.addExFilter.toLowerCase();
    const items = allExercises().filter(e => e.toLowerCase().includes(fl)).map(e => {
      const added = state.workout.exercises.find(ex => ex.name === e);
      const custom = (state.data.customExercises || []).includes(e);
      return `<li onclick="addExerciseToWorkout('${e.replace(/'/g, "\\'")}')"><span>${e}${custom ? ' <span class="ex-tag">eigene</span>' : ''}</span>${added ? '<span class="ex-done">✓</span>' : ''}</li>`;
    }).join('');
    return `<div class="modal-overlay" onclick="if(event.target===this)setState({showAddEx:false,addExFilter:''})">
      <div class="modal"><div class="modal-title">💪 Elegir ejercicio</div>
        <div style="margin-bottom:12px"><input class="text-input" id="exFilterInput" placeholder="Buscar..." value="${state.addExFilter}" oninput="state.addExFilter=this.value;renderModalList()" style="width:100%"/></div>
        <ul class="ex-list" id="exModalList">${items}</ul>
        <div style="margin-top:16px;border-top:1px solid var(--border);padding-top:14px">
          <div style="font-family:'Bebas Neue',sans-serif;font-size:15px;letter-spacing:1px;color:var(--muted);margin-bottom:8px">NUEVO EJERCICIO</div>
          <div class="input-row"><input class="text-input" id="newExWorkoutInput" placeholder="Nombre del ejercicio..." style="font-size:15px"/>
          <button class="btn-secondary" onclick="createAndAddExercise()">+ Add</button></div>
        </div>
      </div></div>`;
  })() : '';
  return `<div class="header"><span class="logo">Training 💪</span>
    <div class="nav-btn-row">
      <button class="nav-btn" onclick="setState({view:'stats'})">📊</button>
      <button class="nav-btn" onclick="setState({view:'history'})">Historial</button>
      <button class="nav-btn" style="color:#ff6b6b;border-color:#ff6b6b" onclick="if(confirm('¿Cancelar entrenamiento?')){cancelTimer();setState({workout:null,view:'home'})}">✕</button>
    </div></div>
  <div class="scroll"><div class="container">
    <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:16px">
      <div class="section-title" style="margin:0">Hoy</div>
      <span style="font-size:12px;color:var(--muted)">${dateStr}</span>
    </div>
    ${empty}${cards}
    <button class="btn-secondary" style="width:100%;padding:13px;margin-top:4px;font-size:15px" onclick="setState({showAddEx:true})">+ Agregar ejercicio</button>
  </div></div>
  <div class="workout-footer"><button class="btn-primary" onclick="finishWorkout()">GUARDAR ENTRENAMIENTO 🔥</button></div>
  ${modalHTML}${timerHTML()}`;
}

function renderModalList() {
  const filter = document.getElementById('exFilterInput')?.value || ''; state.addExFilter = filter;
  const fl = filter.toLowerCase();
  const items = allExercises().filter(e => e.toLowerCase().includes(fl)).map(e => {
    const added = state.workout.exercises.find(ex => ex.name === e);
    const custom = (state.data.customExercises || []).includes(e);
    return `<li onclick="addExerciseToWorkout('${e.replace(/'/g, "\\'")}')"><span>${e}${custom ? ' <span class="ex-tag">eigene</span>' : ''}</span>${added ? '<span class="ex-done">✓</span>' : ''}</li>`;
  }).join('');
  const list = document.getElementById('exModalList'); if (list) list.innerHTML = items;
}

function injectArgentinaTheme() {
  const day = getArgentinaDay();
  let el = document.getElementById('argentina-theme');
  if (!el) { el = document.createElement('style'); el.id = 'argentina-theme'; document.head.appendChild(el); }
  el.textContent = getArgentinaThemeStyle(day);
}

// Show Argentina special overlay on app open (once per day)
function checkArgentinaDayOnOpen() {
  const day = getArgentinaDay();
  if (!day) return;
  const storageKey = 'babe-gym-arg-shown-' + getTodayKey();
  if (localStorage.getItem(storageKey)) return;
  localStorage.setItem(storageKey, '1');
  state.argentinaSplash = day;
}

    </div>` : '';
  const photoHTML = cel.couplePhoto ? `
    <div style="margin-top:16px;width:180px;height:220px;border-radius:16px;overflow:hidden;border:3px solid ${cel.color};box-shadow:0 0 30px ${cel.color}88;position:relative;z-index:1;flex-shrink:0">
      <img src="${cel.couplePhoto}" style="width:100%;height:100%;object-fit:cover;object-position:top" />
    </div>` : `<div style="font-size:${cel.bigEmoji==='🇦🇷'?'90px':'100px'};animation:memeWiggle .8s ease infinite alternate;filter:drop-shadow(0 0 30px ${cel.color}88);position:relative;z-index:1">${cel.bigEmoji}</div>`;
  const btnLabel = cel.couplePhoto ? '🎂 YAY!' : 'VAMOS! 🇦🇷';
  return `
    <div class="arg-celebration" style="position:fixed;inset:0;z-index:600;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;background:radial-gradient(ellipse at center,rgba(${cel.color==='#ff3fa4'?'74,124,89':'116,170,219'},.15) 0%,rgba(0,0,0,.97) 70%);overflow-y:auto;">
      ${sunRays}
      ${photoHTML}
      <div style="font-family:'Bebas Neue',sans-serif;font-size:34px;letter-spacing:3px;color:${cel.color};margin-top:16px;line-height:1.1;position:relative;z-index:1">${cel.title}</div>
      <div style="color:#fff;font-size:14px;margin-top:6px;position:relative;z-index:1">${cel.subtitle}</div>
      <div style="background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.15);border-radius:12px;padding:14px 18px;margin-top:18px;font-size:13px;color:#ccc;line-height:1.6;font-style:italic;max-width:320px;position:relative;z-index:1">${cel.quote}</div>
      <div style="display:flex;gap:12px;margin-top:28px;position:relative;z-index:1">
        <button onclick="${isWorkoutFinish ? 'state.celebration=null;state.argentinaCelebration=null;render()' : 'state.argentinaSplash=null;render()'}" style="background:${cel.color};color:#000;border:none;padding:13px 32px;border-radius:8px;font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:2px;cursor:pointer">${btnLabel}</button>
      </div>
    </div>`;
}

document.addEventListener('visibilitychange', () => {
  if (!document.hidden && state.timerEndAt && state.timerInterval) {
    const rem = Math.max(0, Math.round((state.timerEndAt - Date.now()) / 1000));
    state.timerSeconds = rem;
    if (rem <= 0) { clearInterval(state.timerInterval); state.timerInterval = null; playBeep(); setTimeout(() => { state.timerSeconds = null; render(); }, 1500); }
    else { render(); }
  }
});

checkArgentinaDayOnOpen();
render();
</script>
</body>
</html>
